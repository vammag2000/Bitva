<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Палка · 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #game { display: block; width: 100%; height: 100%; }

  /* ============ ГЛАВНОЕ МЕНЮ ============ */
  #menu {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 35%, #232347 0%, #1a1a2e 70%);
    z-index: 10;
  }
  #menu.hidden { display: none; }

  #menu h1 {
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 800;
    color: #fff;
    letter-spacing: 6px;
    margin-bottom: 28px;
    text-shadow: 0 0 24px rgba(74, 158, 255, 0.5);
  }

  .menu-btn {
    width: min(280px, 75vw);
    padding: 16px 20px;
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    background: rgba(74, 158, 255, 0.15);
    border: 2px solid rgba(74, 158, 255, 0.45);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .menu-btn:hover  { background: rgba(74, 158, 255, 0.35); border-color: rgba(74, 158, 255, 0.8); }
  .menu-btn:active { transform: scale(0.96); }

  /* ============ КНОПКА ПАУЗЫ ============ */
  #pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 52px;
    height: 52px;
    font-size: 24px;
    line-height: 1;
    color: #fff;
    background: rgba(74, 158, 255, 0.15);
    border: 2px solid rgba(74, 158, 255, 0.45);
    border-radius: 12px;
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  #pause-btn.visible { display: flex; }
  #pause-btn:hover  { background: rgba(74, 158, 255, 0.35); border-color: rgba(74, 158, 255, 0.8); }
  #pause-btn:active { transform: scale(0.94); }

  /* ============ ОВЕРЛЕЙ ПАУЗЫ ============ */
  #pause-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10, 10, 25, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 30;
  }
  #pause-overlay.hidden { display: none; }
  #pause-overlay h2 {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 800;
    color: #fff;
    letter-spacing: 4px;
    margin-bottom: 20px;
    text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
  }

  /* ============ СЕНСОРНОЕ УПРАВЛЕНИЕ ============ */
  #touch-controls {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    pointer-events: none;
  }
  #touch-controls.visible { display: block; }

  .dpad {
    position: absolute;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    width: min(210px, 52vmin);
    height: min(210px, 52vmin);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 6px;
    pointer-events: none;
  }
  .dpad .ctrl-btn {
    pointer-events: auto;
    width: 100%;
    height: 100%;
    font-size: clamp(20px, 5vmin, 28px);
    color: #fff;
    background: rgba(74, 158, 255, 0.18);
    border: 2px solid rgba(74, 158, 255, 0.5);
    border-radius: 12px;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
  }
  .dpad .ctrl-btn.pressed {
    background: rgba(74, 158, 255, 0.55);
    border-color: rgba(74, 158, 255, 0.9);
  }
  .dpad-up    { grid-column: 2; grid-row: 1; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 3; }
  .dpad-right { grid-column: 3; grid-row: 2; }

  .attack-btn {
    position: absolute;
    left: max(24px, env(safe-area-inset-left));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: min(120px, 30vmin);
    height: min(120px, 30vmin);
    border-radius: 50%;
    font-size: clamp(36px, 9vmin, 48px);
    color: #fff;
    background: rgba(255, 120, 80, 0.3);
    border: 3px solid rgba(255, 120, 80, 0.75);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.08s, background 0.08s;
  }
  .attack-btn.pressed {
    background: rgba(255, 120, 80, 0.65);
    transform: scale(0.94);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="pause-btn" aria-label="Пауза">⏸️</button>

<div id="touch-controls">
  <div class="dpad">
    <button class="ctrl-btn dpad-up"    data-dir="up"    aria-label="Вверх">▲</button>
    <button class="ctrl-btn dpad-left"  data-dir="left"  aria-label="Влево">◀</button>
    <button class="ctrl-btn dpad-down"  data-dir="down"  aria-label="Вниз">▼</button>
    <button class="ctrl-btn dpad-right" data-dir="right" aria-label="Вправо">▶</button>
  </div>
  <button class="attack-btn" id="attack-btn" aria-label="Удар">⚔️</button>
</div>

<div id="pause-overlay" class="hidden">
  <h2>ПАУЗА</h2>
  <button class="menu-btn" id="btn-resume">Назад в игру</button>
  <button class="menu-btn" id="btn-menu">Меню</button>
</div>

<div id="menu">
  <h1>ПАЛКА</h1>
  <button class="menu-btn" id="btn-online">Онлайн</button>
  <button class="menu-btn" id="btn-play">Играть</button>
  <button class="menu-btn" id="btn-shop">Магазин</button>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let worldW = 0, worldH = 0;
  const WORLD_SCALE = 5;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // Угол взмаха: 90°
  const SWING_ARC = 90 * Math.PI / 180;
  // Фазы взмаха: 0..0.45 замах, 0.45..0.85 удар, 0.85..1 возврат
  const WINDUP_END = 0.45;
  const STRIKE_END = 0.85;

  const player = {
    x: 0, y: 0,
    radius: 20,
    speed: 230,
    facing: -Math.PI / 2,
    stickLength: 55,
    stickThickness: 9,
    swingTime: 0,
    swingDuration: 0.174,
    swingCooldown: 0,
  };

  // ============================================================
  //  СПРАЙТЫ
  // ============================================================
  const stickImg = new Image();
  let stickImgReady = false;
  stickImg.onload = () => { stickImgReady = true; };
  stickImg.onerror = () => { stickImgReady = false; };
  stickImg.src = 'stick.png';

  const PLAYER_SPRITE_SCALE = 5.25;   // было 3.0, теперь +75%
  const playerImg = new Image();
  let playerImgReady = false;
  playerImg.onload = () => { playerImgReady = true; };
  playerImg.onerror = () => { playerImgReady = false; };
  playerImg.src = 'player.png';

  let firstInit = true;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    worldW = W * WORLD_SCALE;
    worldH = H * WORLD_SCALE;

    if (firstInit) {
      player.x = worldW / 2;
      player.y = worldH / 2;
      firstInit = false;
    } else {
      player.x = clamp(player.x, player.radius, worldW - player.radius);
      player.y = clamp(player.y, player.radius, worldH - player.radius);
    }
  }

  // ============================================================
  //  ЗВУК
  // ============================================================
  let audioCtx = null;
  let noiseBuffer = null;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    const sr = audioCtx.sampleRate;
    const len = Math.floor(sr * 0.5);
    noiseBuffer = audioCtx.createBuffer(1, len, sr);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function playSwingSound() {
    if (!audioCtx || !noiseBuffer) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (audioCtx.state !== 'running') return;

    const t = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;

    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.3;
    bp.frequency.setValueAtTime(420, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + 0.08);
    bp.frequency.exponentialRampToValueAtTime(650, t + 0.17);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

    src.connect(bp);
    bp.connect(gain);
    gain.connect(audioCtx.destination);

    src.start(t);
    src.stop(t + 0.2);
  }

  // ============================================================
  //  ВВОД
  // ============================================================
  const input = {
    keys: new Set(),
  };

  const pressedDirs = new Set();
  let attackHeld = false;
  let attackQueued = false;
  let mouseDown = false;

  window.addEventListener('keydown', (e) => {
    resumeAudio();
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    if (e.code === 'Space') attackQueued = true;
    input.keys.add(e.code);
  });
  window.addEventListener('keyup', (e) => input.keys.delete(e.code));

  canvas.addEventListener('mousedown', (e) => {
    resumeAudio();
    if (e.button === 0) mouseDown = true;
  });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) mouseDown = false; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  const dpadButtons = document.querySelectorAll('.dpad .ctrl-btn');
  dpadButtons.forEach((btn) => {
    const dir = btn.dataset.dir;
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resumeAudio();
      pressedDirs.add(dir);
      btn.classList.add('pressed');
    });
    const release = () => {
      pressedDirs.delete(dir);
      btn.classList.remove('pressed');
    };
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);
  });

  const attackBtnEl = document.getElementById('attack-btn');
  attackBtnEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resumeAudio();
    attackHeld = true;
    attackQueued = true;
    attackBtnEl.classList.add('pressed');
  });
  const attackRelease = () => {
    attackHeld = false;
    attackBtnEl.classList.remove('pressed');
  };
  attackBtnEl.addEventListener('pointerup', attackRelease);
  attackBtnEl.addEventListener('pointercancel', attackRelease);
  attackBtnEl.addEventListener('lostpointercapture', attackRelease);

  // ============================================================
  //  ЛОГИКА
  // ============================================================
  function getMoveInput() {
    let mx = 0, my = 0;
    if (pressedDirs.has('left'))  mx -= 1;
    if (pressedDirs.has('right')) mx += 1;
    if (pressedDirs.has('up'))    my -= 1;
    if (pressedDirs.has('down'))  my += 1;

    if (input.keys.has('KeyA') || input.keys.has('ArrowLeft'))  mx -= 1;
    if (input.keys.has('KeyD') || input.keys.has('ArrowRight')) mx += 1;
    if (input.keys.has('KeyW') || input.keys.has('ArrowUp'))    my -= 1;
    if (input.keys.has('KeyS') || input.keys.has('ArrowDown'))  my += 1;

    const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    return { x: mx, y: my, mag: Math.min(m, 1) };
  }

  function startSwing() {
    player.swingTime = 0.0001;
    playSwingSound();
  }

  function getStickAngle() {
    if (player.swingTime > 0) {
      const prog = Math.min(1, player.swingTime / player.swingDuration);
      const halfArc = SWING_ARC / 2;
      if (prog < WINDUP_END) {
        const p = prog / WINDUP_END;
        return player.facing - halfArc * p;
      } else if (prog < STRIKE_END) {
        const p = (prog - WINDUP_END) / (STRIKE_END - WINDUP_END);
        return player.facing - halfArc + SWING_ARC * p;
      } else {
        const p = (prog - STRIKE_END) / (1 - STRIKE_END);
        return player.facing + halfArc - halfArc * p;
      }
    }
    return player.facing;
  }

  function update(dt) {
    const mv = getMoveInput();
    player.x += mv.x * player.speed * dt;
    player.y += mv.y * player.speed * dt;
    player.x = clamp(player.x, player.radius, worldW - player.radius);
    player.y = clamp(player.y, player.radius, worldH - player.radius);

    if (mv.mag > 0.2 && player.swingTime === 0) {
      player.facing = Math.atan2(mv.y, mv.x);
    }

    if (player.swingCooldown > 0) player.swingCooldown -= dt;

    const wantAttack = attackQueued || mouseDown || attackHeld || input.keys.has('Space');
    attackQueued = false;

    if (wantAttack && player.swingTime === 0 && player.swingCooldown <= 0) {
      startSwing();
    }

    if (player.swingTime > 0) {
      player.swingTime += dt;
      if (player.swingTime / player.swingDuration >= 1) {
        player.swingTime = 0;
        player.swingCooldown = 0.08;
      }
    }
  }

  // ============================================================
  //  РЕНДЕР
  // ============================================================
  function drawWorld(camX, camY) {
    const g = 64;
    const x0 = Math.floor(camX / g) * g;
    const y0 = Math.floor(camY / g) * g;
    const x1 = camX + W;
    const y1 = camY + H;

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += g) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += g) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, worldW, worldH);
  }

  function drawPlayer() {
    const p = player;
    const stickAngle = getStickAngle();

    // След от удара (только фаза удара)
    if (p.swingTime > 0) {
      const prog = Math.min(1, p.swingTime / p.swingDuration);
      if (prog >= WINDUP_END && prog < STRIKE_END) {
        const p2 = (prog - WINDUP_END) / (STRIKE_END - WINDUP_END);
        const startA = p.facing - SWING_ARC / 2;
        const endA = startA + SWING_ARC * p2;
        const r = p.radius + p.stickLength;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, startA, endA, false);
        ctx.strokeStyle = 'rgba(255, 226, 120, 0.45)';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    // Тень
    ctx.beginPath();
    ctx.arc(p.x, p.y + 4, p.radius * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Основание палки вынесено к кулакам
    const bx = p.x + Math.cos(stickAngle) * p.radius * 1.1;
    const by = p.y + Math.sin(stickAngle) * p.radius * 1.1;
    const tx = p.x + Math.cos(stickAngle) * (p.radius + p.stickLength);
    const ty = p.y + Math.sin(stickAngle) * (p.radius + p.stickLength);

    // --- ПАЛКА ---
    if (stickImgReady) {
      const midX = (bx + tx) / 2;
      const midY = (by + ty) / 2;
      const drawW = Math.hypot(tx - bx, ty - by);
      const aspect = stickImg.naturalWidth / stickImg.naturalHeight;
      const drawH = drawW / aspect;
      ctx.save();
      ctx.translate(midX, midY);
      ctx.rotate(stickAngle);
      ctx.drawImage(stickImg, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(tx, ty);
      ctx.strokeStyle = '#c89b5c';
      ctx.lineWidth = p.stickThickness;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(tx, ty);
      ctx.strokeStyle = 'rgba(240, 210, 150, 0.65)';
      ctx.lineWidth = p.stickThickness * 0.35;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // --- ПЕРСОНАЖ (РЫЦАРЬ) ---
    if (playerImgReady) {
      const drawW = p.radius * PLAYER_SPRITE_SCALE;
      const aspect = playerImg.naturalWidth / playerImg.naturalHeight;
      const drawH = drawW / aspect;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.facing + Math.PI / 2);
      ctx.drawImage(playerImg, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    } else {
      // Фолбэк: синий круг
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#4a9eff';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1e6fd9';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
    }
  }

  function render() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    const camX = clamp(player.x - W / 2, 0, worldW - W);
    const camY = clamp(player.y - H / 2, 0, worldH - H);

    ctx.save();
    ctx.translate(-camX, -camY);
    drawWorld(camX, camY);
    drawPlayer();
    ctx.restore();
  }

  // ============================================================
  //  ЦИКЛ
  // ============================================================
  let lastTime = 0;
  let running = false;

  function loop(now) {
    if (!running) return;
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function startLoop() {
    running = true;
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  function stopLoop() {
    running = false;
  }

  // ============================================================
  //  СБРОС ИГРЫ
  // ============================================================
  function resetGame() {
    player.x = worldW / 2;
    player.y = worldH / 2;
    player.facing = -Math.PI / 2;
    player.swingTime = 0;
    player.swingCooldown = 0;

    input.keys.clear();
    pressedDirs.clear();
    attackHeld = false;
    attackQueued = false;
    mouseDown = false;

    document.querySelectorAll('.ctrl-btn.pressed, .attack-btn.pressed')
      .forEach((el) => el.classList.remove('pressed'));
  }

  // ============================================================
  //  UI
  // ============================================================
  const menuEl         = document.getElementById('menu');
  const pauseBtn       = document.getElementById('pause-btn');
  const pauseOverlay   = document.getElementById('pause-overlay');
  const touchControls  = document.getElementById('touch-controls');

  document.getElementById('btn-play').addEventListener('click', () => {
    resetGame();
    menuEl.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    pauseBtn.classList.add('visible');
    touchControls.classList.add('visible');
    resumeAudio();
    startLoop();
  });

  pauseBtn.addEventListener('click', () => {
    if (!running) return;
    stopLoop();
    attackQueued = false;
    mouseDown = false;
    attackHeld = false;
    pressedDirs.clear();
    document.querySelectorAll('.ctrl-btn.pressed, .attack-btn.pressed')
      .forEach((el) => el.classList.remove('pressed'));
    pauseBtn.classList.remove('visible');
    touchControls.classList.remove('visible');
    pauseOverlay.classList.remove('hidden');
  });

  document.getElementById('btn-resume').addEventListener('click', () => {
    pauseOverlay.classList.add('hidden');
    pauseBtn.classList.add('visible');
    touchControls.classList.add('visible');
    resumeAudio();
    startLoop();
  });

  document.getElementById('btn-menu').addEventListener('click', () => {
    stopLoop();
    resetGame();
    pauseOverlay.classList.add('hidden');
    pauseBtn.classList.remove('visible');
    touchControls.classList.remove('visible');
    menuEl.classList.remove('hidden');
  });

  // ============================================================
  //  СТАРТ
  // ============================================================
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  resize();
})();
</script>
</body>
</html>
